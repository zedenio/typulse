        <h1>TYPULSE — Fast-Paced Typing Rhythm Game</h1>

        <p>
          TYPULSE is a free browser-based typing game inspired by rhythm
          arcades like osu!. Words appear on screen inside shrinking approach
          rings. Type each word before the ring closes — or it detonates and
          costs you a life. The faster and more accurately you type, the higher
          your score climbs.
        </p>

        <h2>How to Play</h2>
        <ol>
          <li><strong>Type the first letter</strong> of any word to lock onto it. A targeting reticle and blinking caret show which word you are typing.</li>
          <li><strong>Finish the word</strong> before the approach ring touches the pad. Each cleared word earns points scaled by your typing speed.</li>
          <li><strong>Build your combo.</strong> Consecutive words increase a multiplier (up to ×8) that amplifies every score. A wrong key resets the combo and deducts points.</li>
          <li><strong>Don't run out of lives.</strong> You start with 2–3 lives depending on the mode. When a ring closes, the word explodes and you lose one.</li>
        </ol>

        <h2>Four Difficulty Modes</h2>
        <ul>
          <li><strong>Easy</strong> — Slow rings, shorter words, relaxed spawn rate. Great for warming up or learning the controls.</li>
          <li><strong>Normal</strong> — The classic experience. Standard ring timing with the full word pool.</li>
          <li><strong>Hard</strong> — Rings close roughly 40% faster, longer words appear earlier, and more words are on screen at once.</li>
          <li><strong>Expert</strong> — Twice as hard as Hard mode. Rings slam shut, only two lives, and the highest score multiplier for players who can keep up.</li>
        </ul>

        <h2>Speed-Based Scoring</h2>
        <p>
          Every word is individually timed from the first keystroke to the last.
          Typing speed is converted to words-per-minute and a speed tier is
          displayed: <strong>GOOD</strong> (40+ WPM), <strong>FAST</strong>
          (60+), <strong>SUPERB</strong> (85+), or <strong>BLAZING</strong>
          (110+). Faster typing earns up to 3.5× more points than slow typing
          on the same word. This stacks with the combo multiplier and the mode
          multiplier, so skilled play on Expert with a high combo produces
          enormous scores.
        </p>

        <h2>Smooth Difficulty Progression</h2>
        <p>
          Instead of jumping in sudden steps, difficulty rises continuously
          using an exponentially eased curve. As you clear more words, the
          approach rings tighten gradually, spawn intervals shorten, and longer
          words begin to appear — all smoothly, so you never feel a jarring
          spike. A time-based component also ensures that stalling never makes
          the game easier.
        </p>

        <h2>Profile and Career Statistics</h2>
        <p>
          Create a profile with a username to track your performance over time.
          TYPULSE records every run and shows lifetime career statistics:
          average WPM, accuracy, best score, best combo, total words cleared,
          keystrokes, playtime, and your fastest single word. A per-mode
          breakdown shows where you are strongest, and a bar chart of recent
          scores visualises your improvement.
        </p>

        <h2>Game Features</h2>
        <ul>
          <li>5,800-word dictionary sourced from a real English corpus, filtered for typeability and family-friendliness.</li>
          <li>Shuffle-bag word selection ensures no word repeats within a run. Every session is reshuffled.</li>
          <li>Procedural WebAudio sound effects — keystroke ticks, combo chimes, explosion rumbles — synthesised at runtime with zero asset downloads.</li>
          <li>Screen shake, particle bursts, ring shockwaves, and score popups provide satisfying feedback on every action.</li>
          <li>Frame-rate-independent physics using exponential damping, so the game runs identically on 60 Hz and 144 Hz displays.</li>
          <li>Full keyboard and touch support, including mobile virtual-keyboard handling.</li>
          <li>Pause on Escape or tab switch, with instant restart via Enter.</li>
          <li>Runs entirely in the browser — no downloads, no accounts, no server required. All data stays on your device.</li>
        </ul>

        <h2>Technical Details</h2>
        <p>
          TYPULSE is built with React, TypeScript, Vite, and Tailwind CSS. The
          game canvas is rendered with the HTML5 Canvas 2D API at up to 2×
          device-pixel-ratio for sharp text on high-DPI screens. Word sprites
          are pre-rasterised into two static layers (typed and untyped) and
          revealed via clipping, so no canvas work happens during keystrokes.
          The entire application compiles to a single self-contained HTML file
          under 340 KB.
        </p>

        <hr />

        <h2 id="about">About TYPULSE</h2>
        <p>
          TYPULSE is an independent, free-to-play browser game. It was built as
          a personal project to combine the feel of rhythm games with practical
          typing-speed improvement. There are no locked modes, no pay-to-win
          mechanics, and no required sign-ups. Ads help support continued
          development. Tips via Ko-fi are welcome but entirely optional and
          never unlock anything.
        </p>
